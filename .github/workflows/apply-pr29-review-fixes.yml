name: Apply PR29 review fixes

on:
  push:
    branches:
      - fix/goe-identity-eto-delta
    paths:
      - tools/patch-pr29-review-fixes.mjs

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/goe-identity-eto-delta

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Apply review fixes
        run: node tools/patch-pr29-review-fixes.mjs

      - name: Install test dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Syntax and whitespace checks
        run: |
          node --check script.js
          node --check src/goe-import-state.js
          node --check .github/scripts/goe-import-v2.js
          git diff --check

      - name: Verify review fixes
        run: |
          grep -q "const iMeterStartData" script.js
          grep -q "energyMismatchKwh" script.js
          if grep -q "function decimalPlaces" script.js; then
            echo "decimalPlaces precision heuristic still present"
            exit 1
          fi

      - name: Commit patched script.js
        run: |
          if git diff --quiet -- script.js; then
            echo "No script.js changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git commit -m "fix: address PR29 parser review findings"
          git push origin HEAD:fix/goe-identity-eto-delta
