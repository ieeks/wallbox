name: Apply go-e CSV identity patch

on:
  push:
    branches:
      - fix/goe-identity-eto-delta
    paths:
      - tools/patch-goe-csv-identity.mjs
      - .github/workflows/apply-goe-csv-patch.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/goe-identity-eto-delta

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Apply script.js patch
        run: node tools/patch-goe-csv-identity.mjs

      - name: Install test dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Syntax and whitespace checks
        run: |
          node --check script.js
          node --check .github/scripts/goe-import-v2.js
          git diff --check

      - name: Commit patched script.js
        run: |
          if git diff --quiet -- script.js; then
            echo "No script.js changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git commit -m "feat: bridge go-e CSV identity to auto-import"
          git push origin HEAD:fix/goe-identity-eto-delta
