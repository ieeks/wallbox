name: Temporary approved Phase 1 execution

on:
  push:
    branches:
      - feat/goe-reconciliation-apply
    paths:
      - tools/trigger-approved-phase1.txt

permissions:
  contents: read

concurrency:
  group: goe-reconciliation-apply
  cancel-in-progress: false

jobs:
  phase1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Install Firestore dependency
        run: npm install firebase-admin
        working-directory: .github/scripts

      - name: Prepare fresh encrypted pre-write backup and plan
        env:
          GOE_SERIAL: ${{ secrets.GOE_SERIAL }}
          GOE_TOKEN: ${{ secrets.GOE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RECON_BACKUP_KEY: ${{ secrets.RECON_BACKUP_KEY }}
        run: node .github/scripts/goe-reconcile-dry-run.js

      - name: Upload encrypted pre-write backup
        uses: actions/upload-artifact@v4
        with:
          name: goe-reconciliation-phase1-pre-write-${{ github.run_id }}
          path: reconciliation-output/
          if-no-files-found: error
          retention-days: 30

      - name: Apply approved identity backfill only
        env:
          GOE_SERIAL: ${{ secrets.GOE_SERIAL }}
          GOE_TOKEN: ${{ secrets.GOE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RECON_PHASE: identity-backfill
          APPROVED_PLAN_HASH: 1978886b4c6c2df392ca7608b62eeaa403bc6bdf189366986bf0a9b7c922e629
          APPROVED_LEGACY_ROOT: e367fcf5b0d911bda8112e74fcd698e1b072ea52275b671ad519a7edcdac075c
          RECON_CONFIRM: BACKFILL_IDENTITIES
        run: node .github/scripts/goe-reconcile-apply.js

      - name: Fresh post-backfill read-only dry run
        env:
          GOE_SERIAL: ${{ secrets.GOE_SERIAL }}
          GOE_TOKEN: ${{ secrets.GOE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RECON_BACKUP_KEY: ${{ secrets.RECON_BACKUP_KEY }}
        run: |
          rm -rf reconciliation-output
          node .github/scripts/goe-reconcile-dry-run.js

      - name: Upload encrypted post-backfill dry run
        uses: actions/upload-artifact@v4
        with:
          name: goe-reconciliation-phase1-post-write-${{ github.run_id }}
          path: reconciliation-output/
          if-no-files-found: error
          retention-days: 7
