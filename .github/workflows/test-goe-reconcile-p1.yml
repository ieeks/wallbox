name: Validate go-e P1 dry run

on:
  push:
    branches:
      - feat/goe-reconciliation-p1
    paths:
      - tools/run-goe-reconcile-p1.txt

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/goe-reconciliation-p1
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install Firestore dependency
        run: npm install firebase-admin
        working-directory: .github/scripts
      - name: Live read-only dry run
        env:
          GOE_SERIAL: ${{ secrets.GOE_SERIAL }}
          GOE_TOKEN: ${{ secrets.GOE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/goe-reconcile-dry-run.js
      - uses: actions/upload-artifact@v4
        with:
          name: goe-reconciliation-p1-validation
          path: .reconciliation-output/
          retention-days: 7
