name: Validate reconciliation with real backup key

on:
  push:
    branches:
      - feat/goe-reconciliation-p1
    paths:
      - tools/trigger-real-recon.txt

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/goe-reconciliation-p1
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install Firestore dependency
        run: npm install firebase-admin
        working-directory: .github/scripts
      - name: Build encrypted backup and reconciliation plan
        env:
          GOE_SERIAL: ${{ secrets.GOE_SERIAL }}
          GOE_TOKEN: ${{ secrets.GOE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RECON_BACKUP_KEY: ${{ secrets.RECON_BACKUP_KEY }}
        run: node .github/scripts/goe-reconcile-dry-run.js
      - name: Upload encrypted reconciliation bundle
        uses: actions/upload-artifact@v4
        with:
          name: goe-reconciliation-real-secret
          path: reconciliation-output/
          if-no-files-found: error
          retention-days: 7
