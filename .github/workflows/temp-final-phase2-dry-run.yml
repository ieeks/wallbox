name: Temporary final Phase 2 dry run

on:
  push:
    branches:
      - fix/reconciliation-dry-run-structure-gates
    paths:
      - tools/trigger-final-phase2-dry-run.txt

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Install Firestore dependency
        run: npm install firebase-admin
        working-directory: .github/scripts

      - name: Final read-only reconciliation on main
        env:
          GOE_SERIAL: ${{ secrets.GOE_SERIAL }}
          GOE_TOKEN: ${{ secrets.GOE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RECON_BACKUP_KEY: ${{ secrets.RECON_BACKUP_KEY }}
        run: node .github/scripts/goe-reconcile-dry-run.js

      - name: Upload encrypted reconciliation bundle
        uses: actions/upload-artifact@v4
        with:
          name: final-phase2-dry-run
          path: reconciliation-output/
          if-no-files-found: error
          retention-days: 7
