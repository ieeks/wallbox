name: Validate reconciliation review fixes

on:
  push:
    branches:
      - feat/goe-reconciliation-p1
    paths:
      - tools/run-goe-reconcile-review.txt

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/goe-reconciliation-p1
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install Firestore dependency
        run: npm install firebase-admin
        working-directory: .github/scripts
      - name: Live read-only dry run without artifact upload
        env:
          GOE_SERIAL: ${{ secrets.GOE_SERIAL }}
          GOE_TOKEN: ${{ secrets.GOE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RECON_BACKUP_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: node .github/scripts/goe-reconcile-dry-run.js
      - name: Compare data.v3 energy and meter totals
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const envelope = JSON.parse(fs.readFileSync('reconciliation-output/reconciliation-plan.enc.json', 'utf8'));
          const keyBytes = Buffer.from('AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=', 'base64');
          const key = crypto.createHash('sha256')
            .update('ladefuchs-goe-reconciliation-backup-v1\0')
            .update(keyBytes)
            .digest();
          const decipher = crypto.createDecipheriv('aes-256-gcm', key, Buffer.from(envelope.iv, 'base64'));
          decipher.setAuthTag(Buffer.from(envelope.tag, 'base64'));
          const plain = Buffer.concat([
            decipher.update(Buffer.from(envelope.ciphertext, 'base64')),
            decipher.final(),
          ]).toString('utf8');
          const payload = JSON.parse(plain);
          const sum = arr => arr.reduce((a, b) => a + b, 0);
          const energy = sum(payload.sourceSessions.map(s => s.energyKwh));
          const meter = sum(payload.sourceSessions.map(s => s.meterKwh));
          const nonZero = payload.sourceSessions.filter(s => Math.abs(s.sourceDeltaKwh) > 0.0001);
          const lines = payload.sourceCsv.replace(/^\uFEFF/, '').trim().split(/\r?\n/);
          const headers = lines[0].split(';');
          const diffIndex = headers.findIndex(h => h.toLowerCase().includes('zaehlerstand differenz'));
          const meterDiff = diffIndex >= 0
            ? sum(lines.slice(1).map(line => Number(line.split(';')[diffIndex].replace(',', '.'))))
            : NaN;
          console.log(`exportedEnergyKwhTotal=${energy.toFixed(3)}`);
          console.log(`meterSpanKwhTotal=${meter.toFixed(3)}`);
          console.log(`meterDifferenceColumnKwhTotal=${Number.isFinite(meterDiff) ? meterDiff.toFixed(3) : 'n/a'}`);
          console.log(`nonZeroSourceDeltaSessions=${nonZero.length}`);
          console.log(`sourceDeltaKwhTotal=${sum(payload.sourceSessions.map(s => s.sourceDeltaKwh)).toFixed(3)}`);
          NODE
